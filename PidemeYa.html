<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Bundled Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0c;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #__bundler_loading {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      color: #666;
      background: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      z-index: 10000;
    }

    #__bundler_thumbnail {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0c;
      z-index: 9999;
    }

    #__bundler_thumbnail svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #__bundler_placeholder {
      color: #999;
      font-size: 14px;
    }
  </style>
  <noscript>
    <style>
      #__bundler_loading {
        display: none;
      }
    </style>
    <div
      style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

    </div>
  </noscript>
</head>

  <script>

    document.addEventListener('DOMContentLoaded', async function () {
      const loading = document.getElementById('__bundler_loading');
      function setStatus(msg) { if (loading) loading.textContent = msg; }

      // Error sink persists across replaceWith since it's on window, not the DOM.
      window.addEventListener('error', function (e) {
        var p = document.body || document.documentElement;
        var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
        d.id = '__bundler_err';
        d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
        d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
          '[bundle] ' + (e.message || e.type) +
          (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
      }, true);

      try {
        const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
        const templateEl = document.querySelector('script[type="__bundler/template"]');
        if (!manifestEl || !templateEl) {
          setStatus('Error: missing bundle data');
          console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
          return;
        }

        const manifest = JSON.parse(manifestEl.textContent);
        let template = JSON.parse(templateEl.textContent);

        const uuids = Object.keys(manifest);
        setStatus('Unpacking ' + uuids.length + ' assets...');

        const blobUrls = {};
        await Promise.all(uuids.map(async (uuid) => {
          const entry = manifest[uuid];
          try {
            const binaryStr = atob(entry.data);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            let finalBytes = bytes;
            if (entry.compressed) {
              if (typeof DecompressionStream !== 'undefined') {
                const ds = new DecompressionStream('gzip');
                const writer = ds.writable.getWriter();
                const reader = ds.readable.getReader();
                writer.write(bytes);
                writer.close();
                const chunks = [];
                let totalLen = 0;
                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  chunks.push(value);
                  totalLen += value.length;
                }
                finalBytes = new Uint8Array(totalLen);
                let offset = 0;
                for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
              } else {
                console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
              }
            }

            blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
          } catch (err) {
            console.error('Failed to decode asset ' + uuid + ':', err);
            blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
          }
        }));

        const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
        const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
        const resourceMap = {};
        for (const entry of extResources) {
          if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
        }

        setStatus('Rendering...');
        for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

        // Strip integrity + crossorigin — blob URLs from a file:// document inherit
        // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
        // The manifest bytes are ours; SRI protects against CDN compromise, not this.
        template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

        const resourceScript = '<script>window.__resources = ' +
          JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
          ';</' + 'script>';
        // Inject after <head> so the DOCTYPE stays first; prepending the script
        // would push the parser into quirks mode. DOMParser always emits a <head>
        // (synthesizing one if the source HTML omitted it) but may carry
        // attributes through, so match the full opening tag. slice() rather than
        // replace() keeps us clear of $-pattern substitution in resourceScript.
        const headOpen = template.match(/<head[^>]*>/i);
        if (headOpen) {
          const i = headOpen.index + headOpen[0].length;
          template = template.slice(0, i) + resourceScript + template.slice(i);
        }

        // Parse the template and swap the root element. Scripts inserted via
        // DOMParser/replaceWith are inert per spec — re-create each with
        // createElement so they execute, awaiting onload for src scripts to
        // preserve ordering (React before ReactDOM before Babel before text/babel).
        const doc = new DOMParser().parseFromString(template, 'text/html');
        document.documentElement.replaceWith(doc.documentElement);
        const dead = Array.from(document.scripts);
        for (const old of dead) {
          const s = document.createElement('script');
          for (const a of old.attributes) s.setAttribute(a.name, a.value);
          s.textContent = old.textContent;
          // text/babel scripts with a src: fetch and inline. transformScriptTags
          // does XHR against the src, but blob:null/ from a file:// origin is
          // silently dropped. Inlining makes it a plain inline babel script,
          // which transformScriptTags handles unconditionally.
          if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
            const r = await fetch(s.src);
            s.textContent = await r.text();
            s.removeAttribute('src');
          }
          const p = s.src ? new Promise(function (r) { s.onload = s.onerror = r; }) : null;
          old.replaceWith(s);
          if (p) await p;
        }
        // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
        // which fired before we swapped the document. Trigger manually if present.
        if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
          window.Babel.transformScriptTags();
        }
      } catch (err) {
        setStatus('Error unpacking: ' + err.message);
        console.error('Bundle unpack error:', err);
      }
    });

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n\n<script src=\"20ac3a35-253f-4880-baae-6c8ff39b0aa6\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n  <style>\n    *{ box-sizing:border-box; margin:0; padding:0; }\n    html,body{ height:100%; }\n    body{ font-family:\"Helvetica Neue\",Helvetica,Arial,system-ui,sans-serif; background:#0a0a0c; }\n    /* Glow naranja sutil que late detras del reproductor */\n    @keyframes glowPulse{ 0%,100%{ opacity:.55; transform:scale(1); } 50%{ opacity:.8; transform:scale(1.04); } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<!--\n  ============================================================================\n   PidemeYa · Reproductor de demo (PLANTILLA / SCAFFOLD)\n  ============================================================================\n   COMO USAR:\n   1) Pega cada animacion DENTRO de su contenedor por id:\n        #pantalla-laptop      -> Dashboard del ADMINISTRADOR (web, horizontal 16:10)\n        #pantalla-telefono-1  -> Vista del REPARTIDOR (la animacion YA trae su marco)\n        #pantalla-telefono-2  -> Vista del CLIENTE     (la animacion YA trae su marco)\n      Los contenedores de telefono son TRANSPARENTES y sin bisel a proposito.\n      Borra los rotulos guia punteados (\".slot-guia\") cuando pegues tu contenido.\n\n   2) ENGANCHAR AL PLAY/PAUSA GLOBAL:\n      El elemento #escena-demo recibe la clase \"playing\" o \"paused\".\n      Ademas expone dos variables CSS que se actualizan en cada frame:\n          --tiempo    (segundos transcurridos, ej \"12.480s\")\n          --progreso  (0 a 1)\n      OPCION A (animaciones CSS @keyframes): dentro de tus animaciones usa\n          animation-play-state: paused;            // estado por defecto\n          #escena-demo.playing & { animation-play-state: running; }\n      OPCION B (sincronizar al tiempo global): usa animation-delay negativo,\n          animation-delay: calc(var(--tiempo) * -1);  animation-play-state: paused;\n      OPCION C (JS): lee el atributo style --progreso / --tiempo de #escena-demo,\n          o escucha cambios de la clase \"playing\" con un MutationObserver.\n  ============================================================================\n-->\n\n<div ref=\"{{ rootRef }}\" style=\"min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:40px 28px; background:radial-gradient(120% 90% at 50% -10%, rgba(242,101,34,.12), transparent 55%), radial-gradient(100% 100% at 50% 120%, rgba(242,101,34,.06), transparent 60%), #0a0a0c;\">\n\n  <!-- MARCO DEL REPRODUCTOR -->\n  <div style=\"position:relative; width:100%; max-width:1280px;\">\n\n    <!-- Resplandor naranja detras del marco -->\n    <div style=\"position:absolute; inset:-6% -4%; z-index:0; background:radial-gradient(60% 60% at 50% 45%, color-mix(in oklab, var(--acento,#F26522) 45%, transparent), transparent 70%); filter:blur(70px); animation:glowPulse 6s ease-in-out infinite; pointer-events:none;\"><\u002Fdiv>\n\n    <div style=\"position:relative; z-index:1; border-radius:22px; overflow:hidden; background:linear-gradient(180deg, #141417 0%, #0e0e11 100%); border:1px solid rgba(255,255,255,.07); box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 40px 90px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(0,0,0,.4);\">\n\n      <!-- BARRA DE TITULO -->\n      <div style=\"display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid rgba(255,255,255,.06); background:rgba(255,255,255,.015);\">\n        <div style=\"display:flex; gap:7px; align-items:center;\">\n          <span style=\"width:11px; height:11px; border-radius:50%; background:#ff5f57;\"><\u002Fspan>\n          <span style=\"width:11px; height:11px; border-radius:50%; background:#febc2e;\"><\u002Fspan>\n          <span style=\"width:11px; height:11px; border-radius:50%; background:#28c840;\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:9px; margin:0 auto; transform:translateX(-22px);\">\n          <span style=\"width:9px; height:9px; border-radius:2px; background:var(--acento,#F26522); box-shadow:0 0 10px color-mix(in oklab, var(--acento,#F26522) 70%, transparent);\"><\u002Fspan>\n          <span style=\"color:#f2f2f4; font-size:13px; font-weight:600; letter-spacing:.2px;\">PidemeYa<\u002Fspan>\n          <span style=\"color:rgba(255,255,255,.3); font-size:13px;\">·<\u002Fspan>\n          <span style=\"color:rgba(255,255,255,.55); font-size:13px; font-weight:500;\">Demo en vivo<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600; letter-spacing:.4px; color:#ff5f57; text-transform:uppercase;\">\n          <span style=\"width:7px; height:7px; border-radius:50%; background:#ff5f57; box-shadow:0 0 8px #ff5f57;\"><\u002Fspan>REC\n        <\u002Fspan>\n      <\u002Fdiv>\n\n      <!-- ====================== ESCENA (3 DISPOSITIVOS) ======================\n           #escena-demo recibe la clase playing/paused y expone --tiempo / --progreso -->\n      <div id=\"escena-demo\" ref=\"{{ sceneRef }}\" class=\"{{ estadoClase }}\" style=\"position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; background:radial-gradient(80% 70% at 50% 30%, #1b1b20 0%, #0c0c0f 70%);\">\n\n        <!-- Piso / reflejo sutil -->\n        <div style=\"position:absolute; left:0; right:0; bottom:0; height:42%; background:linear-gradient(180deg, transparent, rgba(242,101,34,.05)); pointer-events:none;\"><\u002Fdiv>\n\n        <!-- ----------------------- LAPTOP (PROTAGONISTA, al fondo-centro) ----------------------- -->\n        <div style=\"position:absolute; left:50%; top:5%; transform:translateX(-50%); width:57%; z-index:1; display:flex; flex-direction:column; align-items:center;\">\n\n          <!-- Rotulo de la laptop -->\n          <div style=\"margin-bottom:14px; display:flex; align-items:center; gap:7px; padding:5px 13px; border-radius:999px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09);\">\n            <span style=\"width:6px; height:6px; border-radius:1px; background:var(--acento,#F26522);\"><\u002Fspan>\n            <span style=\"font-size:11px; font-weight:700; letter-spacing:1px; color:rgba(255,255,255,.78); text-transform:uppercase;\">Vista del administrador<\u002Fspan>\n          <\u002Fdiv>\n\n          <!-- Tapa + pantalla -->\n          <div style=\"width:100%; padding:11px 11px 12px; border-radius:14px 14px 6px 6px; background:linear-gradient(180deg,#2a2a30,#16161a); border:1px solid rgba(255,255,255,.08); box-shadow:0 30px 60px -25px rgba(0,0,0,.9);\">\n            <!-- camara -->\n            <div style=\"width:5px; height:5px; border-radius:50%; background:#0c0c0f; margin:0 auto 8px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);\"><\u002Fdiv>\n\n            <!-- >>> PANTALLA LAPTOP — DASHBOARD ADMIN INCRUSTADO (16:10) <<<\n                 El dashboard \"Gestion de Pedidos\" se renderiza a tamaño fijo 1440x900 (16:10) y se\n                 escala con transform para encajar exacto en el slot (ver dashScaleRef en la logica). -->\n            <div id=\"pantalla-laptop\" ref=\"{{ laptopSlot }}\" style=\"position:relative; width:100%; aspect-ratio:16/10; border-radius:5px; overflow:hidden; background:#f4f5f9;\">\n              <div ref=\"{{ dashScale }}\" style=\"position:absolute; top:0; left:0; width:1440px; height:900px; transform-origin:top left; will-change:transform;\">\n                <x-import component-from-global-scope=\"gestion-pedidos\" from=\"4f268d66-4528-48be-b6f4-2191f226edf5#/GestionPedidos.js\" hint-size=\"100%,100%\" style=\"display:block; width:100%; height:100%;\"><\u002Fx-import>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Base / teclado (trapecio) -->\n          <div style=\"width:118%; height:16px; margin-top:0; clip-path:polygon(3% 0, 97% 0, 100% 100%, 0 100%); background:linear-gradient(180deg,#3a3a42,#1d1d22); box-shadow:0 18px 30px -12px rgba(0,0,0,.8);\"><\u002Fdiv>\n          <!-- muesca de apertura -->\n          <div style=\"width:16%; height:5px; margin-top:-16px; border-radius:0 0 6px 6px; background:#0c0c0f;\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ----------------------- TELEFONO IZQUIERDO (REPARTIDOR) — ANIMACION INCRUSTADA -----------------------\n             PidemeYaDemo trae su propio marco de telefono (lienzo 1080x1920 transparente, el\n             telefono va centrado pero ocupa una fraccion menor del lienzo que la vista cliente;\n             por eso el lienzo se sobredimensiona mas (width 166%) para igualar el tamaño visible\n             del telefono de la derecha. Espejo de la vista cliente. -->\n        <div style=\"position:absolute; left:3%; bottom:4%; width:19%; aspect-ratio:9/19.5; z-index:3; transform:rotate(-6deg); transform-origin:bottom center;\">\n          <!-- Rotulo (por encima del telefono) -->\n          <div style=\"position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:12px; z-index:4; white-space:nowrap; display:flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; background:color-mix(in oklab, var(--acento,#F26522) 16%, #16161a); border:1px solid color-mix(in oklab, var(--acento,#F26522) 35%, transparent);\">\n            <span style=\"width:6px; height:6px; border-radius:50%; background:var(--acento,#F26522);\"><\u002Fspan>\n            <span style=\"font-size:10px; font-weight:700; letter-spacing:.6px; color:#fff; text-transform:uppercase;\">Vista del repartidor<\u002Fspan>\n          <\u002Fdiv>\n          <!-- Sombra (capa aparte, NO envuelve el contenido) -->\n          <div style=\"position:absolute; left:6%; right:6%; top:3%; bottom:-3%; border-radius:30px; background:rgba(0,0,0,.6); filter:blur(26px); z-index:0; pointer-events:none;\"><\u002Fdiv>\n          <!-- >>> ANIMACION REPARTIDOR (id conservado). Lienzo 9:16; telefono centrado dentro. <<< -->\n          <div id=\"pantalla-telefono-1\" style=\"position:absolute; left:50%; bottom:-4%; transform:translateX(-50%); width:143%; aspect-ratio:9/16; z-index:1;\">\n            <x-import component-from-global-scope=\"PidemeYaDemo\" from=\"84f96f58-3e2b-4a96-8d59-e7ef364ae69f#/PidemeYaDemo.jsx\" hint-size=\"100%,100%\"><\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ----------------------- TELEFONO DERECHO (CLIENTE) — ANIMACION INCRUSTADA -----------------------\n             La animacion (ChatCommercial sobre Stage) YA trae su propio marco de telefono.\n             El lienzo es 1080x1920 transparente y el telefono va centrado dentro; por eso el\n             contenedor del lienzo (width 150%, 9:16) se sobredimensiona para que el telefono\n             llene la zona del slot. Margenes transparentes = invisibles. -->\n        <!-- NITIDEZ: sin filter en el contenedor (rasterizaria el contenido escalado). La sombra\n             va en una capa HERMANA detras; la capa del telefono se promueve (translateZ/will-change). -->\n        <div style=\"position:absolute; right:3%; bottom:4%; width:19%; aspect-ratio:9/19.5; z-index:3; transform:rotate(6deg); transform-origin:bottom center;\">\n          <!-- Rotulo (por encima del telefono) -->\n          <div style=\"position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:12px; z-index:4; white-space:nowrap; display:flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; background:color-mix(in oklab, var(--acento,#F26522) 16%, #16161a); border:1px solid color-mix(in oklab, var(--acento,#F26522) 35%, transparent);\">\n            <span style=\"width:6px; height:6px; border-radius:50%; background:var(--acento,#F26522);\"><\u002Fspan>\n            <span style=\"font-size:10px; font-weight:700; letter-spacing:.6px; color:#fff; text-transform:uppercase;\">Vista del cliente<\u002Fspan>\n          <\u002Fdiv>\n          <!-- Sombra (capa aparte, NO envuelve el contenido) -->\n          <div style=\"position:absolute; left:6%; right:6%; top:3%; bottom:-3%; border-radius:30px; background:rgba(0,0,0,.6); filter:blur(26px); z-index:0; pointer-events:none;\"><\u002Fdiv>\n          <!-- >>> ANIMACION CLIENTE (id conservado). Lienzo 9:16; el telefono va centrado dentro,\n               por eso se sobredimensiona el lienzo y se ancla al fondo del slot. <<< -->\n          <div id=\"pantalla-telefono-2\" style=\"position:absolute; left:50%; bottom:-4%; transform:translateX(-50%); width:129%; aspect-ratio:9/16; z-index:1;\">\n            <x-import component=\"Stage\" from=\"17364432-8b48-424b-a1e9-4d998f71d6ed#/animations.jsx\" width=\"1080\" height=\"1920\" duration=\"52\" background=\"transparent\" loop=\"true\" controls=\"false\" persist-key=\"pidemeya-cliente\" hint-size=\"100%,100%\">\n              <x-import component=\"ChatCommercial\" from=\"c099b9e3-5e55-412a-8c0b-4b2fd338e3bb#/ChatCommercial.jsx\" accent=\"#F26522\" transparent=\"true\" hint-size=\"100%,100%\"><\u002Fx-import>\n            <\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n      <!-- ====================== /ESCENA ====================== -->\n\n      <!-- ====================== BARRA DE CONTROLES ====================== -->\n      <div style=\"display:flex; align-items:center; gap:18px; padding:16px 22px; border-top:1px solid rgba(255,255,255,.06); background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.2));\">\n\n        <!-- PLAY / PAUSA (controla las 3 animaciones a la vez) -->\n        <button type=\"button\" onclick=\"{{ togglePlay }}\" style=\"flex:none; width:46px; height:46px; border-radius:50%; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; background:var(--acento,#F26522); box-shadow:0 6px 20px -4px color-mix(in oklab, var(--acento,#F26522) 75%, transparent);\" style-hover=\"filter:brightness(1.08);\" style-active=\"transform:scale(.95);\">\n          <sc-if value=\"{{ pausado }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"display:block; width:0; height:0; border-style:solid; border-width:8px 0 8px 13px; border-color:transparent transparent transparent #fff; margin-left:3px;\"><\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ playing }}\">\n            <span style=\"display:flex; gap:4px;\"><span style=\"width:4px; height:15px; background:#fff; border-radius:1px;\"><\u002Fspan><span style=\"width:4px; height:15px; background:#fff; border-radius:1px;\"><\u002Fspan><\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n\n        <!-- LINEA DE TIEMPO (scrubber) — clic o arrastre para saltar el tiempo -->\n        <div onpointerdown=\"{{ onTrackDown }}\" style=\"flex:1; height:22px; display:flex; align-items:center; cursor:pointer;\">\n          <div ref=\"{{ trackRef }}\" style=\"position:relative; width:100%; height:6px; border-radius:999px; background:rgba(255,255,255,.13);\">\n            <div ref=\"{{ fillRef }}\" style=\"position:absolute; left:0; top:0; height:100%; width:0%; border-radius:999px; background:var(--acento,#F26522);\"><\u002Fdiv>\n            <div ref=\"{{ thumbRef }}\" style=\"position:absolute; left:0%; top:50%; width:15px; height:15px; border-radius:50%; background:#fff; transform:translate(-50%,-50%); box-shadow:0 2px 6px rgba(0,0,0,.5);\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- TIEMPO transcurrido / total -->\n        <span ref=\"{{ timeRef }}\" style=\"flex:none; font-family:ui-monospace,Menlo,monospace; font-size:13px; font-weight:500; color:rgba(255,255,255,.72); letter-spacing:.5px; min-width:96px; text-align:right;\">00:00 / 00:00<\u002Fspan>\n      <\u002Fdiv>\n      <!-- ====================== /CONTROLES ====================== -->\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:820},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F26522&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;durationSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:58,&quot;min&quot;:5,&quot;max&quot;:600,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;}}\">\nclass Component extends DCLogic {\n  state = { playing: false };\n\n  // Reloj global de la demo (en segundos). Lo manejamos fuera de React (instancia)\n  // para animar el scrubber suavemente sin re-render en cada frame.\n  t = 0;\n  raf = null;\n  last = null;\n  _dragging = false;\n\n  rootRef = React.createRef();\n  sceneRef = React.createRef();\n  fillRef = React.createRef();\n  thumbRef = React.createRef();\n  timeRef = React.createRef();\n  trackRef = React.createRef();\n  laptopSlot = React.createRef();\n  dashScale = React.createRef();\n\n  get duration() { return Math.max(1, this.props.durationSeconds ?? 58); }\n\n  // ════════════════════ CAPA 2 — ORQUESTACION POR EVENTOS ════════════════════\n  // Reloj MAESTRO unico (segundos 0..58). Cada vista NO usa su reloj propio: lee\n  // window.__pyMap(masterTime, claveVista) para obtener su tiempo LOCAL, mapeado\n  // con keyframes anclados a los beats REALES de cada animacion (sacados del codigo).\n  //\n  // Beats reales detectados:\n  //   CLIENTE  (persistKey 'pidemeya-cliente', dur 52): \"¡Pedido confirmado!\" @40.3s ·\n  //            \"tu pedido fue aceptado\" @43.6s · (outro de marca @46.5 -> NO se llega)\n  //   REPARTIDOR (persistKey 'pidemeya-demo', dur 38): notif NUEVO PEDIDO @3.1s ·\n   //           acepta (tap@5.35 / WhatsApp) @5.9s · \"Pedido asignado/GPS\" @9.0s · ENTREGADO @30.95s\n  //   ADMIN    (clave 'admin', reloj interno en ms 0..13000): inserta fila 2.0-2.75s ·\n  //            EN CAMINO + repartidor asignado 4.4-5.1s · ENTREGADO + caja suma 8.0-9.1s\n  //\n  // Linea de tiempo maestra (master s -> local de cada vista):\n  //   0s   EVENTO 0  cliente reproduce; repartidor y admin en reposo\n  //   26s  EVENTO 1  cliente \"Pedido confirmado\" -> repartidor notif NUEVO PEDIDO + admin fila PENDIENTE\n  //   30s  EVENTO 2  repartidor acepta -> admin EN CAMINO+asignado · cliente \"aceptado\" y SE DETIENE\n  //   30-52 EVENTO 3 repartidor en ruta/tracking · admin fijo EN CAMINO\n  //   52s  EVENTO 4  repartidor ENTREGADO -> admin ENTREGADO (verde) + caja suma\n  //   55-58 EVENTO 5 pausa final (tableau completo) y reinicia el ciclo en loop\n  installMaster() {\n    // (sin guard: reinstala el mapa en cada montaje para reflejar cambios de keyframes)\n    const MAPS = {\n      // [masterTime, localTime]\n      'pidemeya-cliente': [[0,0],[26,40.3],[30,44.5],[58,44.5]],\n      'pidemeya-demo':    [[0,3.0],[26,3.1],[30,7.0],[52,30.95],[55,33.0],[58,33.0]],\n      'admin':            [[0,0],[26,1900],[30,5200],[49,5700],[52.5,8900],[58,9100]], // admin en ms\n    };\n    window.__pyMap = (mt, key) => {\n      const kf = MAPS[key]; if (!kf) return null;\n      if (mt <= kf[0][0]) return kf[0][1];\n      for (let i = 1; i < kf.length; i++) {\n        if (mt <= kf[i][0]) {\n          const [t0, v0] = kf[i - 1], [t1, v1] = kf[i];\n          const r = t1 === t0 ? 0 : (mt - t0) / (t1 - t0);\n          return v0 + (v1 - v0) * r;\n        }\n      }\n      return kf[kf.length - 1][1];\n    };\n  }\n\n  // Escala el dashboard (renderizado a 1440x900) para encajar exacto en el slot de la laptop.\n  scaleDash = () => {\n    const slot = this.laptopSlot.current, dash = this.dashScale.current;\n    if (!slot || !dash) return;\n    dash.style.transform = `scale(${slot.clientWidth / 1440})`;\n  };\n\n  componentDidMount() {\n    this.installMaster();\n    this.applyAccent();\n    this.updateUI();\n    this.scaleDash();\n    if (this.laptopSlot.current) {\n      this._ro = new ResizeObserver(this.scaleDash);\n      this._ro.observe(this.laptopSlot.current);\n    }\n    this._onMove = (e) => { if (this._dragging) this.seekClientX(e.clientX); };\n    this._onUp = () => { this._dragging = false; };\n    window.addEventListener('pointermove', this._onMove);\n    window.addEventListener('pointerup', this._onUp);\n    const tick = (ts) => {\n      if (this.last == null) this.last = ts;\n      const dt = (ts - this.last) / 1000;\n      this.last = ts;\n      if (this.state.playing) {\n        this.t += dt;\n        if (this.t >= this.duration) this.t = this.t % this.duration; // LOOP sincronizado\n        this.updateUI();\n      }\n      this.raf = requestAnimationFrame(tick);\n    };\n    this.raf = requestAnimationFrame(tick);\n  }\n\n  componentDidUpdate() { this.applyAccent(); }\n\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n    window.removeEventListener('pointermove', this._onMove);\n    window.removeEventListener('pointerup', this._onUp);\n    if (this._ro) this._ro.disconnect();\n  }\n\n  applyAccent() {\n    const c = this.props.accentColor;\n    if (c && this.rootRef.current) this.rootRef.current.style.setProperty('--acento', c);\n  }\n\n  fmt(s) {\n    s = Math.max(0, Math.floor(s));\n    const m = Math.floor(s / 60), ss = s % 60;\n    return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');\n  }\n\n  // Escribe el estado del reloj en el DOM + expone el hook de sincronizacion.\n  updateUI() {\n    const p = Math.min(1, this.t / this.duration);\n    if (this.fillRef.current) this.fillRef.current.style.width = (p * 100) + '%';\n    if (this.thumbRef.current) this.thumbRef.current.style.left = (p * 100) + '%';\n    if (this.timeRef.current) this.timeRef.current.textContent = this.fmt(this.t) + ' / ' + this.fmt(this.duration);\n    // ----- HOOK PARA TUS 3 ANIMACIONES: variables CSS en #escena-demo -----\n    if (this.sceneRef.current) {\n      this.sceneRef.current.style.setProperty('--tiempo', this.t.toFixed(3) + 's');\n      this.sceneRef.current.style.setProperty('--progreso', p.toFixed(4));\n    }\n    // ----- CAPA 1: RELOJ MAESTRO -----\n    // Las animaciones (Stage de animations.jsx y de PidemeYaDemo.jsx) leen este objeto\n    // y mapean su tiempo local por PROGRESO: localTime = progreso * duracionPropia.\n    // Asi play/pausa y scrubber controlan las 3 a la vez y loopean juntas.\n    // (Capa 2: para alinear beats por contenido, cambiar el mapeo a offset+velocidad.)\n    const m = (window.__pyMaster = window.__pyMaster || {});\n    m.progress = p;            // 0..1 — fuente de verdad para sincronizar\n    m.time = this.t;\n    m.duration = this.duration;\n    m.playing = this.state.playing;\n  }\n\n  togglePlay = () => {\n    // Cambiar state.playing aplica/quita la clase \"playing\" en #escena-demo (ver renderVals).\n    this.setState(s => ({ playing: !s.playing }), () => { this.last = null; });\n  };\n\n  seekClientX(x) {\n    const el = this.trackRef.current;\n    if (!el) return;\n    const r = el.getBoundingClientRect();\n    let ratio = (x - r.left) / r.width;\n    ratio = Math.max(0, Math.min(1, ratio));\n    this.t = ratio * this.duration;\n    this.updateUI();\n  }\n\n  onTrackDown = (e) => { this._dragging = true; this.seekClientX(e.clientX); };\n\n  renderVals() {\n    return {\n      playing: this.state.playing,\n      pausado: !this.state.playing,\n      estadoClase: this.state.playing ? 'playing' : 'paused',\n      togglePlay: this.togglePlay,\n      onTrackDown: this.onTrackDown,\n      rootRef: this.rootRef,\n      sceneRef: this.sceneRef,\n      fillRef: this.fillRef,\n      thumbRef: this.thumbRef,\n      timeRef: this.timeRef,\n      trackRef: this.trackRef,\n      laptopSlot: this.laptopSlot,\n      dashScale: this.dashScale,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
